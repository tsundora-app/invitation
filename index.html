<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Sarabun:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--fond:#f3e6c8;--texte:#3b2a1a;--accent:#a8452a;--accent-texte:#fff8e8;--neutre:#e9d7ae;--papier:#fbf1d9;--vert:#6b8f3a;--rose:#d6336c;
  --police:'Sarabun',system-ui,sans-serif;--titre:'Kanit','Sarabun',system-ui,sans-serif;--rayon:10px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--fond);color:var(--texte);font-family:var(--police);font-size:17px;line-height:1.45;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.riz{display:block;width:100%;height:92px;flex:none}
#app{flex:1;width:100%;max-width:420px;margin:0 auto;padding:18px 20px 24px;display:flex;flex-direction:column}
.ecran{display:none;flex:1;flex-direction:column;gap:20px;animation:ap .25s ease}
.ecran.actif{display:flex}
@keyframes ap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-family:var(--titre);font-weight:600;color:var(--accent);font-size:1.5rem;line-height:1.25;margin:0 0 10px;text-align:center}
p{margin:0;text-align:center}
.sous{font-family:var(--titre);font-weight:500;font-size:1.05rem}
.emoji{font-size:3rem;text-align:center}
.note{font-size:.9rem;opacity:.7}
button,input{font:inherit;font-size:16px}
.btn{min-height:54px;border:2px solid var(--accent);border-radius:var(--rayon);background:transparent;color:var(--accent);font-weight:600;padding:10px 18px;cursor:pointer;width:100%;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn.opt{min-height:46px;font-size:15px;padding:8px 14px}
.btn.principal{background:var(--accent);color:var(--accent-texte);box-shadow:0 3px 0 #6e2c19}
.btn.choisi{background:var(--vert);border-color:var(--vert);color:#fff}
.btn:disabled{opacity:.35}
.btn.suite{margin-top:auto}
.ecran > :first-child,.prog + *{margin-top:auto}
.ecran > .prog{margin-top:0}
.pl{white-space:pre-line}
.retour{width:auto;min-height:40px;align-self:center;border:0;background:none;color:var(--texte);padding:0 14px;opacity:.65;font-size:14px;font-weight:400}
.prog{display:flex;flex-direction:column;gap:8px;padding-top:14px;font-size:.85rem;text-align:center}
.barre{position:relative;height:8px;background:var(--neutre);border-radius:4px}
.barre i{display:block;position:relative;height:100%;background:var(--vert);border-radius:4px}
.barre i::after{content:"🛵";position:absolute;right:-8px;top:-18px;font-size:18px;line-height:1;transform:scaleX(-1)}
.liste{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.rep{white-space:pre-line;background:var(--papier);border-left:5px solid var(--rose);border-radius:var(--rayon);padding:14px 16px;margin-top:0;font-size:.92rem;font-style:italic}
input[type=text]{min-height:50px;width:100%;border:2px solid var(--accent);border-radius:var(--rayon);padding:0 14px;background:var(--papier);color:var(--texte)}
.grille{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.grille .j{min-height:42px;padding:0;font-size:.95rem}
.grille .j:disabled{border-color:transparent;background:var(--neutre);opacity:.5}
.grille .ent{text-align:center;font-size:.8rem;opacity:.6}
.recap{background:var(--papier);border-radius:var(--rayon);padding:14px 16px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.recap b{font-weight:600}
.photo{/* PHOTO : remplace cette ligne par ta ligne .photo réglée */width:130px;height:130px;border-radius:50%;object-fit:cover;object-position:50% 0%;align-self:center}
img.photo{border:3px solid var(--accent)}
.prer{margin:0;padding-left:20px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.italique{font-style:italic;font-size:.92rem;opacity:.8}
.tampon{align-self:center;border:3px solid var(--rose);color:var(--rose);border-radius:8px;padding:6px 16px;font-family:var(--titre);font-weight:600;letter-spacing:.1em;transform:rotate(-6deg);opacity:.85}
.rvis{display:flex;justify-content:center}
.rvis.fin{margin-bottom:auto}
.gifrefus{max-width:100%;max-height:35dvh;border-radius:var(--rayon)}
#gif{display:none;position:fixed;inset:0;z-index:10;background:var(--fond);align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center}
#gif.visible{display:flex}
#gif img{max-width:100%;max-height:55dvh;border-radius:var(--rayon)}
#gif .emoji{font-size:5rem}
.legende{font-family:var(--titre);font-weight:600;font-size:1.25rem;letter-spacing:.02em;color:var(--accent)}
.erreur{color:#c0392b;font-size:.9rem}
pre{white-space:pre-wrap;text-align:left;background:var(--papier);padding:12px;border-radius:var(--rayon);font-size:.8rem}
</style>
</head>
<body>
<svg class="riz" viewBox="0 0 420 92" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<circle cx="330" cy="30" r="15" fill="#e0922f"/>
<path d="M0 52Q70 30 140 48T280 44T420 50V92H0Z" fill="#a9bd74"/>
<path d="M0 62Q60 48 120 60T250 58T420 62V92H0Z" fill="#86a24d"/>
<path d="M0 72Q80 62 160 72T320 70T420 74V92H0Z" fill="#6b8f3a"/>
<path d="M0 82Q90 76 170 83T340 81T420 84V92H0Z" fill="#e2c35c"/>
</svg>
<div id="app"></div>
<div id="gif"></div>
<script src="config.js"></script>
<script>
(function(){
const C = CONFIG, A = C.accroche, T = C.theme, R = A.refus, E = A.refusEtapes;
const S = document.documentElement.style;
S.setProperty("--fond",T.fond); S.setProperty("--texte",T.texte); S.setProperty("--accent",T.accent);
S.setProperty("--accent-texte",T.accentTexte); S.setProperty("--neutre",T.neutre);
S.setProperty("--police",T.police); S.setProperty("--rayon",T.rayon); S.setProperty("--vert",T.vert); S.setProperty("--rose",T.rose); S.setProperty("--titre",T.policeTitre); S.setProperty("--papier",T.papier);

const app = document.getElementById("app"), gifBox = document.getElementById("gif");
const rep = {}, lab = {}, ordre = [];
let prenom = "", etape = 0, occupe = false, accueil;

const el = (t, p = {}, ...k) => { const e = Object.assign(document.createElement(t), p); k.flat().forEach(x => x && e.append(x)); return e; };
const txt = (t, c = "") => el("p", {textContent: t, className: c});
const btn = (t, f, c = "") => el("button", {className: "btn " + c, textContent: t, onclick: f});
const ecran = (...k) => { const s = el("section", {className: "ecran"}, ...k); app.append(s); return s; };
const show = s => { document.querySelectorAll(".ecran").forEach(x => x.classList.toggle("actif", x === s)); s.onShow && s.onShow(); window.scrollTo(0, 0); };

// Préchargement des GIFs pour qu'ils démarrent dès l'affichage
[A.gifOui, ...E.map(e => e.gif)].forEach(u => { if (u) new Image().src = u; });

function gif(src, emoji, msg, fin, duree){
  if (occupe) return; occupe = true;
  gifBox.replaceChildren(src ? el("img", {src, alt: ""}) : el("div", {className: "emoji", textContent: emoji}), txt(msg, "legende"));
  gifBox.classList.add("visible");
  if (duree === 0) return;               // 0 = le GIF reste à l'écran (dernier refus)
  setTimeout(() => { gifBox.classList.remove("visible"); occupe = false; fin && fin(); }, duree || A.dureeGifMs);
}

async function envoyer(donnees, ok, ko){
  if (!C.cleWeb3Forms) return ok(el("pre", {textContent: "MODE TEST (pas de clé Web3Forms)\n\n" + JSON.stringify(donnees, null, 2)}));
  try{
    const r = await fetch("https://api.web3forms.com/submit", {method: "POST",
      headers: {"Content-Type": "application/json", Accept: "application/json"},
      body: JSON.stringify({access_key: C.cleWeb3Forms, subject: C.objetDuMail, ...donnees})});
    const j = await r.json(); if (!j.success) throw 0; ok();
  } catch(e){ ko(); }
}

const fFinal = ecran(el("h1", {className: "tf"}), txt(C.final.texte), txt(C.final.texte2), el("p", {className: "sous", textContent: C.final.fin}), C.final.tampon ? el("div", {className: "tampon", textContent: C.final.tampon}) : "", el("div", {className: "extra"}));

// ---------- Parcours ----------
const noeuds = [];
const Q = C.parcours.length;
let q = 0;
const suiv = i => () => show(noeuds[i + 1]);
const retour = i => btn("← Retour", () => show(i === 0 ? accueil : noeuds[i - 1]), "retour");
const progression = () => { q++; return el("div", {className: "prog"}, `Étape ${q}/${Q}`,
  el("div", {className: "barre"}, Object.assign(el("i"), {style: `width:${Math.round(q / Q * 100)}%`}))); };

C.parcours.forEach((e, i) => {
  let s;
  if (e.type === "info"){
    const emo = () => el("div", {className: "emoji", textContent: e.emoji || "🐈"});
    const visuel = e.image ? el("img", {src: e.image, alt: "", className: "photo", onerror: function(){ this.replaceWith(emo()); }})
                           : (e.emoji ? emo() : "");
    s = ecran(progression(), visuel, el("h1", {textContent: e.titre}),
      e.sous ? txt(e.sous, "sous") : "", e.texte ? txt(e.texte) : "",
      e.titreListe ? txt(e.titreListe, "sous") : "",
      e.liste ? el("ul", {className: "prer"}, e.liste.map(x => el("li", {textContent: x}))) : "",
      e.fin ? txt(e.fin, "italique") : "",
      btn(e.bouton || "Suivant", suiv(i), "principal suite"), retour(i));
  } else if (e.type === "date"){
    lab[e.id] = e.recap; ordre.push(e.id);
    const ok = btn("Continuer", suiv(i), "principal suite"); ok.disabled = true;
    const g = el("div", {className: "grille"}); let sel;
    "LMMJVSD".split("").forEach(l => g.append(el("div", {className: "ent", textContent: l})));
    const d0 = new Date(); d0.setHours(0, 0, 0, 0);
    const lundi = new Date(d0); lundi.setDate(d0.getDate() - ((d0.getDay() + 6) % 7));
    for (let n = 0; n < e.semaines * 7; n++){
      const d = new Date(lundi); d.setDate(lundi.getDate() + n);
      const dispo = d > d0 && e.jours.includes(d.getDay());
      const b = el("button", {className: "btn j", disabled: !dispo, textContent: d.getDate() === 1 ? d.getDate() + "/" + (d.getMonth() + 1) : d.getDate()});
      b.onclick = () => { sel && sel.classList.remove("choisi"); sel = b; b.classList.add("choisi");
        rep[e.id] = d.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"}); ok.disabled = false; };
      g.append(b);
    }
    s = ecran(progression(), el("h1", {textContent: e.titre}), g, txt(e.note, "note"), ok, retour(i));
  } else if (e.type === "choix"){
    lab[e.id] = e.recap; ordre.push(e.id);
    const ok = btn("Continuer", suiv(i), "principal suite"); ok.disabled = true;
    const r = el("div", {className: "rep"}); r.hidden = true;
    const bs = e.options.map(o => {
      const opt = typeof o === "string" ? {label: o} : o;
      const b = btn(opt.label, () => {
        bs.forEach(x => x.classList.remove("choisi")); b.classList.add("choisi"); rep[e.id] = opt.label; ok.disabled = false;
        const t = opt.texte || (e.reponses ? e.reponses[opt.reponse] : e.reponse);
        r.hidden = !t; r.textContent = t || "";
      }, "opt");
      return b;
    });
    s = ecran(progression(), el("h1", {textContent: e.titre}), el("div", {className: "liste"}, bs), r, ok, retour(i));
  } else if (e.type === "recap"){
    const inp = el("input", {type: "text", placeholder: e.placeholder, autocomplete: "given-name"});
    const lst = el("div", {className: "recap"});
    const ok = btn(e.bouton, () => {
      ok.disabled = true; prenom = inp.value.trim();
      const d = {"Prénom": prenom, "Statut": "OUI"}; ordre.forEach(k => d[lab[k]] = rep[k] || "-");
      envoyer(d, extra => { fFinal.querySelector(".tf").textContent = C.final.titre.replace("{prenom}", prenom);
        fFinal.querySelector(".extra").replaceChildren(extra || ""); show(fFinal); },
        () => { ok.disabled = false; ok.after(el("p", {className: "erreur", textContent: "L'envoi a échoué, réessaie."})); });
    }, "principal suite");
    ok.disabled = true; inp.oninput = () => ok.disabled = !inp.value.trim();
    s = ecran(progression(), el("h1", {textContent: e.titre}), lst, txt(e.labelPrenom, "sous"), inp, ok, retour(i));
    s.onShow = () => lst.replaceChildren(...ordre.map(k => el("div", {}, el("b", {textContent: lab[k] + " : "}), rep[k] || "-")));
  }
  noeuds.push(s);
});

// ---------- Refus : un seul écran, la légende, le GIF et le bouton changent à chaque Non ----------
const rLeg = el("h1"), rVis = el("div", {className: "rvis"}), rQ = txt(R.titre, "sous");
const rMontre = btn(R.boutonMontre, () => show(noeuds[0]), "principal suite");
const rNon = btn("", () => refus(etape + 1));
const refusEcran = ecran(rLeg, rVis, rQ, rMontre, rNon);
let timer;
function refus(k){
  etape = k;
  const e = E[k], dernier = k >= E.length - 1;
  clearTimeout(timer);
  rLeg.textContent = e.message;
  const emo = () => el("div", {className: "emoji", textContent: e.emoji});
  rVis.replaceChildren(e.gif ? el("img", {src: e.gif, alt: "", className: "gifrefus", onerror: function(){ this.replaceWith(emo()); }}) : emo());
  rVis.classList.toggle("fin", dernier);                  // dernier écran : légende + GIF centrés (plus rien en bas)
  rQ.hidden = rMontre.hidden = rNon.hidden = dernier;      // dernier Non : le GIF reste, plus de boutons
  if (dernier){
    envoyer({"Statut": "REFUS"}, extra => { if (extra) rVis.append(extra); }, () => {});
  } else {
    rNon.textContent = E[k + 1].bouton;
    rMontre.disabled = rNon.disabled = true;               // boutons actifs une fois le GIF vu
    timer = setTimeout(() => { rMontre.disabled = rNon.disabled = false; }, e.duree || A.dureeGifMs);
  }
  show(refusEcran);
}

// ---------- Accroche ----------
const oui = btn(A.texteOui, () => gif(A.gifOui, A.emojiOui, A.messageOui, () => show(noeuds[0])), "principal suite");
const non = btn(E[0].bouton, () => refus(0));
accueil = ecran(A.titre ? el("h1", {textContent: A.titre}) : "", txt(A.texte, "pl"), oui, non, A.note ? txt(A.note, "note") : "");
accueil.onShow = () => { etape = 0; };
show(accueil);
})();
</script>
</body>
</html>
