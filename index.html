<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Invitation</title>
<style>
:root{--fond:#fff;--texte:#1a1a1a;--accent:#1a1a1a;--accent-texte:#fff;--neutre:#f0f0f0;--police:system-ui,sans-serif;--rayon:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--texte);font-family:var(--police);font-size:17px;line-height:1.4;overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{min-height:100dvh;max-width:420px;margin:0 auto;padding:20px;display:flex;flex-direction:column;justify-content:center}
.ecran{display:none;flex-direction:column;gap:16px;animation:ap .25s ease}
.ecran.actif{display:flex}
@keyframes ap{from{opacity:0}to{opacity:1}}
h1{font-size:1.45rem;line-height:1.25;margin:0 0 6px;text-align:center}
p{margin:0;text-align:center}
.sous{font-weight:600;font-size:1.1rem}
.emoji{font-size:3rem;text-align:center}
.note{font-size:.9rem;opacity:.65}
button,input{font:inherit;font-size:16px}
.btn{min-height:54px;border:0;border-radius:var(--rayon);background:var(--neutre);color:var(--texte);padding:10px 18px;cursor:pointer;width:100%}
.btn.opt{min-height:46px;font-size:15px;padding:8px 14px}
.btn.principal,.btn.choisi{background:var(--accent);color:var(--accent-texte)}
.btn:disabled{opacity:.35}
.btn.suite{margin-top:8px}
.retour{width:auto;min-height:40px;align-self:flex-start;background:none;padding:0 6px;opacity:.7;font-size:15px}
.prog{display:flex;flex-direction:column;gap:6px;font-size:.85rem;opacity:.75;text-align:center}
.barre{height:6px;background:var(--neutre);border-radius:3px;overflow:hidden}
.barre i{display:block;height:100%;background:var(--accent)}
.liste{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.rep{background:var(--neutre);border-radius:var(--rayon);padding:14px 16px;margin-top:8px;font-size:.92rem;font-style:italic}
input[type=text]{min-height:50px;width:100%;border:2px solid var(--neutre);border-radius:var(--rayon);padding:0 14px;background:var(--fond);color:var(--texte)}
.grille{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.grille .j{min-height:42px;padding:0;font-size:.95rem}
.grille .ent{text-align:center;font-size:.8rem;opacity:.55}
.recap{background:var(--neutre);border-radius:var(--rayon);padding:14px 16px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.recap b{font-weight:600}
#gif{display:none;position:fixed;inset:0;z-index:10;background:var(--fond);align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;text-align:center}
#gif.visible{display:flex}
#gif img{max-width:100%;max-height:55dvh;border-radius:var(--rayon)}
#gif .emoji{font-size:5rem}
.erreur{color:#c0392b;font-size:.9rem}
pre{white-space:pre-wrap;text-align:left;background:var(--neutre);padding:12px;border-radius:var(--rayon);font-size:.8rem}
</style>
</head>
<body>
<div id="app"></div>
<div id="gif"></div>
<script src="config.js"></script>
<script>
(function(){
const C = CONFIG, A = C.accroche, T = C.theme, R = A.refus, E = A.refusEtapes;
const S = document.documentElement.style;
S.setProperty("--fond",T.fond); S.setProperty("--texte",T.texte); S.setProperty("--accent",T.accent);
S.setProperty("--accent-texte",T.accentTexte); S.setProperty("--neutre",T.neutre);
S.setProperty("--police",T.police); S.setProperty("--rayon",T.rayon);

const app = document.getElementById("app"), gifBox = document.getElementById("gif");
const rep = {}, lab = {}, ordre = [];
let prenom = "", etape = 0, occupe = false, accueil;

const el = (t, p = {}, ...k) => { const e = Object.assign(document.createElement(t), p); k.flat().forEach(x => x && e.append(x)); return e; };
const txt = (t, c = "") => el("p", {textContent: t, className: c});
const btn = (t, f, c = "") => el("button", {className: "btn " + c, textContent: t, onclick: f});
const ecran = (...k) => { const s = el("section", {className: "ecran"}, ...k); app.append(s); return s; };
const show = s => { document.querySelectorAll(".ecran").forEach(x => x.classList.toggle("actif", x === s)); s.onShow && s.onShow(); window.scrollTo(0, 0); };

// Préchargement des GIFs pour qu'ils démarrent dès l'affichage
[A.gifOui, ...E.map(e => e.gif)].forEach(u => { if (u) new Image().src = u; });

function gif(src, emoji, msg, fin){
  if (occupe) return; occupe = true;
  gifBox.replaceChildren(src ? el("img", {src, alt: ""}) : el("div", {className: "emoji", textContent: emoji}), txt(msg));
  gifBox.classList.add("visible");
  setTimeout(() => { gifBox.classList.remove("visible"); occupe = false; fin && fin(); }, A.dureeGifMs);
}

async function envoyer(donnees, ok, ko){
  if (!C.cleWeb3Forms) return ok(el("pre", {textContent: "MODE TEST (pas de clé Web3Forms)\n\n" + JSON.stringify(donnees, null, 2)}));
  try{
    const r = await fetch("https://api.web3forms.com/submit", {method: "POST",
      headers: {"Content-Type": "application/json", Accept: "application/json"},
      body: JSON.stringify({access_key: C.cleWeb3Forms, subject: C.objetDuMail, ...donnees})});
    const j = await r.json(); if (!j.success) throw 0; ok();
  } catch(e){ ko(); }
}

const fRefus = ecran(el("h1", {textContent: R.finTitre}), txt(R.finTexte), el("div", {className: "extra"}));
const fFinal = ecran(el("h1", {className: "tf"}), txt(C.final.texte), txt(C.final.texte2), el("p", {className: "sous", textContent: C.final.fin}), el("div", {className: "extra"}));

// ---------- Parcours ----------
const noeuds = [];
const Q = C.parcours.filter(e => e.type === "date" || e.type === "choix").length;
let q = 0;
const suiv = i => () => show(noeuds[i + 1]);
const retour = i => btn("← Retour", () => show(i === 0 ? accueil : noeuds[i - 1]), "retour");
const progression = () => { q++; return el("div", {className: "prog"}, `Question ${q}/${Q}`,
  el("div", {className: "barre"}, Object.assign(el("i"), {style: `width:${Math.round(q / Q * 100)}%`}))); };

C.parcours.forEach((e, i) => {
  let s;
  if (e.type === "info"){
    s = ecran(retour(i), e.emoji ? el("div", {className: "emoji", textContent: e.emoji}) : "", el("h1", {textContent: e.titre}),
      e.sous ? txt(e.sous, "sous") : "", txt(e.texte), btn(e.bouton || "Suivant", suiv(i), "principal suite"));
  } else if (e.type === "date"){
    lab[e.id] = e.recap; ordre.push(e.id);
    const ok = btn("Continuer", suiv(i), "principal suite"); ok.disabled = true;
    const g = el("div", {className: "grille"}); let sel;
    "LMMJVSD".split("").forEach(l => g.append(el("div", {className: "ent", textContent: l})));
    const d0 = new Date(); d0.setHours(0, 0, 0, 0);
    const lundi = new Date(d0); lundi.setDate(d0.getDate() - ((d0.getDay() + 6) % 7));
    for (let n = 0; n < e.semaines * 7; n++){
      const d = new Date(lundi); d.setDate(lundi.getDate() + n);
      const dispo = d > d0 && e.jours.includes(d.getDay());
      const b = el("button", {className: "btn j", disabled: !dispo, textContent: d.getDate() === 1 ? d.getDate() + "/" + (d.getMonth() + 1) : d.getDate()});
      b.onclick = () => { sel && sel.classList.remove("choisi"); sel = b; b.classList.add("choisi");
        rep[e.id] = d.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"}); ok.disabled = false; };
      g.append(b);
    }
    s = ecran(retour(i), progression(), el("h1", {textContent: e.titre}), g, txt(e.note, "note"), ok);
  } else if (e.type === "choix"){
    lab[e.id] = e.recap; ordre.push(e.id);
    const ok = btn("Continuer", suiv(i), "principal suite"); ok.disabled = true;
    const r = el("div", {className: "rep"}); r.hidden = true;
    const bs = e.options.map(o => {
      const opt = typeof o === "string" ? {label: o} : o;
      const b = btn(opt.label, () => {
        bs.forEach(x => x.classList.remove("choisi")); b.classList.add("choisi"); rep[e.id] = opt.label; ok.disabled = false;
        const t = e.reponses ? e.reponses[opt.reponse] : e.reponse;
        r.hidden = !t; r.textContent = t || "";
      }, "opt");
      return b;
    });
    s = ecran(retour(i), progression(), el("h1", {textContent: e.titre}), el("div", {className: "liste"}, bs), r, ok);
  } else if (e.type === "recap"){
    const inp = el("input", {type: "text", placeholder: e.placeholder, autocomplete: "given-name"});
    const lst = el("div", {className: "recap"});
    const ok = btn(e.bouton, () => {
      ok.disabled = true; prenom = inp.value.trim();
      const d = {"Prénom": prenom, "Statut": "OUI"}; ordre.forEach(k => d[lab[k]] = rep[k] || "-");
      envoyer(d, extra => { fFinal.querySelector(".tf").textContent = C.final.titre.replace("{prenom}", prenom);
        fFinal.querySelector(".extra").replaceChildren(extra || ""); show(fFinal); },
        () => { ok.disabled = false; ok.after(el("p", {className: "erreur", textContent: "L'envoi a échoué, réessaie."})); });
    }, "principal suite");
    ok.disabled = true; inp.oninput = () => ok.disabled = !inp.value.trim();
    s = ecran(retour(i), el("h1", {textContent: e.titre}), lst, txt(e.labelPrenom, "sous"), inp, ok);
    s.onShow = () => lst.replaceChildren(...ordre.map(k => el("div", {}, el("b", {textContent: lab[k] + " : "}), rep[k] || "-")));
  }
  noeuds.push(s);
});

// ---------- Refus en 4 étapes (le Non ne bouge jamais) ----------
function refus(k){
  const e = E[k];
  gif(e.gif, e.emoji, e.message, () => {
    if (k < E.length - 1){ etape = k + 1; show(triste); return; }
    envoyer({"Statut": "REFUS"}, extra => { fRefus.querySelector(".extra").replaceChildren(extra || ""); show(fRefus); }, () => show(fRefus));
  });
}
const refusBtn = btn("", () => refus(etape));
const triste = ecran(el("h1", {textContent: R.titre}),
  btn(R.boutonMontre, () => { etape = 0; show(noeuds[0]); }, "principal"), refusBtn);
triste.onShow = () => { refusBtn.textContent = E[etape].bouton; };

// ---------- Accroche ----------
const oui = btn(A.texteOui, () => gif(A.gifOui, A.emojiOui, A.messageOui, () => show(noeuds[0])), "principal");
const non = btn(E[0].bouton, () => refus(0));
accueil = ecran(el("h1", {textContent: A.titre}), txt(A.texte), oui, non, A.note ? txt(A.note, "note") : "");
accueil.onShow = () => { etape = 0; };
show(accueil);
})();
</script>
</body>
</html>
